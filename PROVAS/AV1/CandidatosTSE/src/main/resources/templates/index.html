<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Candidatos - Eleições 2026 - MG</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="cabecalho">
    <div class="container"><h1>Candidatos - Eleições 2026 - MG</h1></div>
</header>

<main class="container">
    <form method="get" th:action="@{/}" class="filtros" aria-label="Filtros de Candidatos">
        <div class="campo">
            <label for="texto">Buscar por nome / número</label>
            <input id="texto" type="search" name="texto" placeholder="Ex: Ana, 1240..."
                   th:value="${textoSelecionado}">
        </div>
        <div class="campo">
            <label for="cargo">Cargo</label>
            <select id="cargo" name="cargo">
                <option value="" th:selected="${cargoSelecionado == ''}">Todos</option>
                <option th:each="opcao : ${cargos}" th:value="${opcao}" th:text="${opcao}"
                        th:selected="${opcao == cargoSelecionado}"></option>
            </select>
        </div>
        <div class="campo">
            <label for="partido">Partido</label>
            <select id="partido" name="partido">
                <option value="" th:selected="${partidoSelecionado == ''}">Todos</option>
                <option th:each="opcao : ${partidos}" th:value="${opcao}" th:text="${opcao}"
                        th:selected="${opcao == partidoSelecionado}"></option>
            </select>
        </div>
        <div class="acoes">
            <button type="submit">Filtrar</button>
            <a th:href="@{/}" class="limpar">Limpar</a>
        </div>
    </form>

    <p class="resultado" th:text="|${total} candidato(s) encontrado(s).|">0 candidato(s) encontrado(s).</p>
    <p class="vazio" th:if="${total == 0}">Nenhum candidato encontrado. Tente ajustar os filtros.</p>

    <div class="grade-candidatos" th:if="${total > 0}">
        <article class="card" th:each="cand : ${candidatos}">
            <div class="foto-wrapper">
                <img class="foto-candidato" th:src="@{'/images/candidatos/' + ${cand.nomeArquivoFoto}}"
                     th:alt="|Foto de ${cand.nomeUrna}|" loading="lazy"
                     onerror="this.hidden=true;this.nextElementSibling.hidden=false">
                <span class="sem-foto" hidden>Sem foto</span>
            </div>
            <div class="card-conteudo">
                <h2 th:text="${cand.nomeUrna}">Nome de urna</h2>
                <p><strong>Número:</strong> <span th:text="${cand.nrCandidato}">00</span></p>
                <p><strong th:text="${cand.cargo}">Cargo</strong></p>
                <p th:if="${!#strings.isEmpty(cand.siglaPartido)}">
                    <span th:text="${cand.siglaPartido}">Sigla</span>
                    <span th:if="${!#strings.isEmpty(cand.nomePartido)}" th:text="| - ${cand.nomePartido}|"></span>
                </p>
                <p th:if="${!#strings.isEmpty(cand.municipio)}" th:text="${cand.municipio}"></p>
                <p th:if="${cand.idade >= 0}" th:text="|${cand.idade} anos|"></p>
                <p th:if="${!#strings.isEmpty(cand.ocupacao) and cand.ocupacao != '#NULO'}"
                   th:text="${cand.ocupacao}"></p>
                <p th:if="${!#strings.isEmpty(cand.grauInstrucao) and cand.grauInstrucao != '#NULO'}"
                   th:text="${cand.grauInstrucao}"></p>
                <p class="nome-civil" th:if="${!#strings.isEmpty(cand.nomeCandidato)}"
                   th:text="${cand.nomeCandidato}"></p>
            </div>
        </article>
    </div>
</main>
</body>
</html>
