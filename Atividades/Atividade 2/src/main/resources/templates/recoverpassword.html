<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: base('Recuperar senha', ~{::conteudo})}">
<body>

<section class="cartao" th:fragment="conteudo">

    <div th:replace="~{fragments/marca :: logo}"></div>

    <h1 class="titulo">Vamos<br>recuperar.</h1>
    <p class="legenda">Informe o email da conta e enviaremos um link para você criar uma nova senha.</p>

    <div class="aviso aviso--ok" th:if="${sucesso}" role="status">
        <span aria-hidden="true">✓</span>
        <span th:text="${sucesso}">Mensagem</span>
    </div>

    <div class="aviso aviso--erro" th:if="${erro}" role="alert">
        <span aria-hidden="true">✕</span>
        <span th:text="${erro}">Mensagem</span>
    </div>

    <form th:action="@{/recoverpassword}" method="post">
        <div class="campo">
            <label for="email">Email da conta</label>
            <input type="email" id="email" name="email"
                   placeholder="voce@exemplo.com" autocomplete="email" required autofocus>
        </div>

        <button type="submit" class="botao">Enviar link de recuperação</button>
    </form>

    <p class="dica" style="margin-top: 18px;">O link vale por 30 minutos e só funciona uma vez.</p>

    <nav class="rodape-links rodape-links--centro">
        <a th:href="@{/login}">Voltar para o login</a>
    </nav>

</section>

</body>
</html>
