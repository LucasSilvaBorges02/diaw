<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: base('Criar conta', ~{::conteudo})}">
<body>

<section class="cartao cartao--largo" th:fragment="conteudo">

    <div th:replace="~{fragments/marca :: logo}"></div>

    <h1 class="titulo">Comece por<br>aqui.</h1>
    <p class="legenda">Leva menos de um minuto: preencha os campos e sua conta está criada.</p>

    <form th:action="@{/register}" th:object="${cadastroForm}" method="post" novalidate>

        <div class="campo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" th:field="*{nome}"
                   th:classappend="${#fields.hasErrors('nome')} ? 'invalido'"
                   placeholder="Como podemos te chamar" autocomplete="name">
            <span class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
        </div>

        <div class="campo">
            <label for="username">Nome de usuário</label>
            <input type="text" id="username" th:field="*{username}"
                   th:classappend="${#fields.hasErrors('username')} ? 'invalido'"
                   placeholder="seu.usuario" autocomplete="username">
            <span class="erro-campo" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>

        <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'invalido'"
                   placeholder="voce@exemplo.com" autocomplete="email">
            <span class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" th:field="*{senha}"
                   th:classappend="${#fields.hasErrors('senha')} ? 'invalido'"
                   placeholder="••••••••" autocomplete="new-password">
            <span class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></span>
        </div>
        <p class="dica">Mínimo de 8 caracteres, misturando letras e números.</p>

        <div class="campo">
            <label for="confirmacaoSenha">Repita a senha</label>
            <input type="password" id="confirmacaoSenha" th:field="*{confirmacaoSenha}"
                   th:classappend="${#fields.hasErrors('confirmacaoSenha')} ? 'invalido'"
                   placeholder="••••••••" autocomplete="new-password">
            <span class="erro-campo" th:if="${#fields.hasErrors('confirmacaoSenha')}"
                  th:errors="*{confirmacaoSenha}"></span>
        </div>

        <button type="submit" class="botao">Criar conta</button>
    </form>

    <nav class="rodape-links rodape-links--centro">
        <a th:href="@{/login}">Já tenho conta, quero entrar</a>
    </nav>

</section>

</body>
</html>
