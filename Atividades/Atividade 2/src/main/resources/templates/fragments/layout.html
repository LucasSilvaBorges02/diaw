<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" th:fragment="base(titulo, corpo)">
<head>

    <meta name="theme-color" content="#1B1140">
    <title th:text="${titulo} + ' · Horizonte'">Horizonte</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

<main class="palco">
    <div th:replace="${corpo}">conteúdo da página</div>

</body>
</html>
