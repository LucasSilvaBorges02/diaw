spring.application.name=horizonte-auth
server.port=8080

# ---------------------------------------------------------------- banco (H2)
# Arquivo local: os usuarios continuam salvos entre execucoes.
spring.datasource.url=jdbc:h2:file:./data/horizonte;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do banco em http://localhost:8080/h2-console (apenas desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------------ thymeleaf
spring.thymeleaf.cache=false

# ----------------------------------------------------------------- aplicacao
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.seed-demo=true

# ---------------------------------------------------------------------- email
# Deixe app.mail.enabled=false para rodar sem credenciais:
# o link de recuperacao aparece no console em vez de ser enviado.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_USER:nao-responda@horizonte.local}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
