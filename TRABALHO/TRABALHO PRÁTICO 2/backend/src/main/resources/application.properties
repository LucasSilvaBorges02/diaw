spring.application.name=aluguel-api
server.port=${PORT:8080}

# Sem DB_URL roda com H2 em memória (dev). Em produção aponta para o Postgres do Supabase.
spring.datasource.url=${DB_URL:jdbc:h2:mem:aluguel;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.segredo=${JWT_SECRET:}
app.jwt.validade-horas=8
app.cors.origens=${CORS_ORIGENS:http://localhost:5173,https://*.vercel.app}
app.seed=${SEED:true}
